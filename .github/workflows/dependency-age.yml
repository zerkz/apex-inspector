name: Dependency policy

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/dependency-age.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      # pnpm validates the lockfile against minimumReleaseAge
      # (pnpm-workspace.yaml) during install and fails on violations.
      - run: pnpm install --frozen-lockfile
